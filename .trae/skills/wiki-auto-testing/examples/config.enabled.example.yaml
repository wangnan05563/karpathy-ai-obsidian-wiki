# =============================================================================
# wiki-auto-testing — 启用示例配置（针对 karpathy-wiki 真实仓库）
# -----------------------------------------------------------------------------
# 本文件是对 config.yaml / defaults.yaml 中四个「默认关闭」步骤类型的 *启用版* 示例。
# 直接把 config.yaml 里对应块的 enabled 改为 true 即可启用；本文件展示针对本仓库
# 真实路径与字段的推荐取值，便于一键复制。
#
# 覆盖的步骤类型（对应编码规范 → 前端/后端审查规则）：
#   1. cross_account_session_check  → CODING-SESSION-ISOLATION / 前端 FR-069
#   2. byok_per_user_override       → CODING-BYOK / 前端 FR-070 / 后端 BR-072
#   3. streaming_resume_check       → CODING-STREAMING-RESUME / 前端 FR-071
#   4. indexeddb_test_isolation     → fake-indexeddb 测试隔离（第九轮复盘）
#   5. frontend_review_static_check → 前端编码标准静态守卫（第十三轮复盘 / FR-077~FR-080）
#      注：本仓库默认已具备这些保护性代码，故作为「回归守卫」启用；
#      若某规范尚未落地，对应 required_patterns 会告警，按需关闭该组或先修复源码。
#
# 所有路径相对仓库根；字段名取自真实源码，非占位符。
# =============================================================================

cross_account_session_check:
  # 启用：多账户会话隔离验证（FR-RM-05/06 复盘）
  enabled: true
  # 会话 store（Pinia setup store），真实路径
  conversation_store_path: "karpathy-wiki/frontend/src/stores/conversations.ts"
  # 会话按此字段隔离（ConversationRecord.ownerId）
  owner_field: "ownerId"
  # 必须加入 store return 的会话状态 ref（漏加则 resetSession 赋值不可观测=死状态）
  session_state_refs:
    - "currentConversationId"
    - "scopedOwnerId"
  # auth watch 信号：useAuthStore().user?.id（conversations.ts 第 36 行）
  auth_watch_signal: "user?.id"
  # 复用 id 持久化前以 IndexedDB 实际记录（dbGet）校验归属，他人记录绝不覆盖
  persist_reuse_owner_check: true
  # 恶意 owner id 样本（越权访问须被 reject）
  malicious_owner_ids:
    - "other-user-id"
    - "attacker"
  # 账户切换/登出必须触发 resetSession（作废 currentConversationId+scopedOwnerId、清空列表）
  require_reset_on_auth: true

byok_per_user_override:
  # 启用：BYOK 多用户密钥代理验证（前端 FR-070 / 后端 BR-072）
  enabled: true
  # 前端按用户命名空间读写配置的服务层（键内化 userId）
  user_config_service: "karpathy-wiki/frontend/src/services/userConfig.ts"
  # 按用户命名空间键前缀（userConfigKey = `usercfg::<kind>::<userId>`）
  user_config_namespaces:
    - "usercfg::ai::"
    - "usercfg::search::"
    - "usercfg::tools::"
  # 随请求体下发的覆盖配置字段（PerRequestOverride 形状）
  override_fields:
    - "llmConfig"
    - "searchConfig"
    - "toolsConfig"
  # 仅经请求体下发、禁止落盘 / 回显 GET / 记日志的敏感字段
  secret_fields:
    - "apiKey"
  # 缺任一即 400 的必需密钥字段（llmConfig: provider/baseUrl/model/apiKey）
  require_key_fields:
    - "apiKey"
    - "provider"
    - "baseUrl"
    - "model"
  # 覆盖纯函数（运行时零副作用、不读写存储）
  override_func: "applyPerRequestOverride"
  # 空/默认工具配置须回退服务端共享配置（不清空）
  empty_override_falls_back: true

streaming_resume_check:
  # 启用：流式回答增量持久化与续答验证（FR-RM-09 复盘）
  enabled: true
  # 持有流式分片的 store（streamingAnswer / isLoading）
  streaming_store_path: "karpathy-wiki/frontend/src/stores/query.ts"
  # 增量落盘防抖毫秒（须 > 0，验证是否防抖落盘而非仅完成时）
  persist_debounce_ms: 1500
  # 上次活跃会话存储键（STORAGE_KEYS.LAST_ACTIVE_CONVERSATION，常量值 'lastActiveConversation'）
  last_active_key: "LAST_ACTIVE_CONVERSATION"
  # 触发续答的会话末条状态（status:'streaming'，query.ts 第 391 行）
  streaming_status: "streaming"
  # 页面卸载/切页不得 abort 在途流（仅卸监听、后台继续生成）
  no_abort_on_unmount: true
  # SPA 重挂载且后台流活跃(isLoading)时跳过续答
  skip_when_loading: true

indexeddb_test_isolation:
  # 启用：前端隔离测试纪律验证（chatDb + fake-indexeddb 测试隔离复盘）
  enabled: true
  # 隔离测试须使用的唯一命名空间键前缀（每条用例用不同 userId，根本不依赖清空数据库）
  namespace_prefixes:
    - "tts-config::"
    - "usercfg::"
  # 禁止在 beforeEach 使用（会导致连接未关闭 onblocked / 10s 钩子超时 / 跨用例泄漏）
  forbidden_patterns:
    - "indexedDB.deleteDatabase"
  # fake-indexeddb 异步落盘（onsuccess 是 macrotask）须 flush 的轮数（单次 flush 不足）
  flush_rounds: 10

route_response_branch_coverage:
  # 启用：归档路由响应分支覆盖（第十二轮复盘）
  enabled: true
  # 被测归档路由（支持 :threadId 路径占位符）
  route_name: "/api/threads/:threadId/archive"
  method: "GET"
  # 分支用例：逐分支断言返回状态码；用真实 threadId / ts 替换占位符后启用
  branch_cases:
    - name: "valid_main_path"
      description: "合法参数 + 非空内容 → 200，响应含 content/refs"
      params:
        threadId: "<valid_thread_id>"
        messageIndex: "0"
        ts: "<valid_ts>"
      expected_status: 200
      required_fields: ["content", "refs"]
    - name: "fallback_no_content"
      description: "无归档内容 → 回退 404"
      params:
        threadId: "<valid_thread_id>"
        messageIndex: "0"
        ts: "<valid_ts>"
      expected_status: 404
    - name: "illegal_thread_id"
      description: "非法 threadId → 400"
      params:
        threadId: "..%2f.."
        messageIndex: "0"
        ts: "<valid_ts>"
      expected_status: 400
    - name: "non_integer_message_index"
      description: "非整数 messageIndex → 400"
      params:
        threadId: "<valid_thread_id>"
        messageIndex: "abc"
        ts: "<valid_ts>"
      expected_status: 400
    - name: "missing_message_index"
      description: "缺失 messageIndex → 400"
      params:
        threadId: "<valid_thread_id>"
        ts: "<valid_ts>"
      expected_status: 400
    - name: "illegal_ts"
      description: "非法 ts（当前回退实现返回 200；修复为 RangeError 拦截后改 400）"
      params:
        threadId: "<valid_thread_id>"
        messageIndex: "0"
        ts: "not-a-number"
      expected_status: 200
    - name: "empty_content"
      description: "空内容（no-op 落盘防护）→ 400"
      params:
        threadId: "<valid_thread_id>"
        messageIndex: "0"
        ts: "<valid_ts>"
        content: ""
      expected_status: 400

backend_review_static_check:
  # 启用：后端编码标准静态守卫（第十五轮复盘 / BR-089~BR-092）
  enabled: true
  # 扫描后端源码目录（本项目对齐 karpathy-wiki/api/src）
  scan_dirs:
    - "karpathy-wiki/api/src"
  file_glob: "*.ts"
  # 内置五组：路由 return 完整性 / 响应钩子安全 / 压缩默认关闭 / 用户库初始化完整性 / PowerShell 端口清理安全
  # 命中即提示人工复核对应分支/钩子/注册/加载/清理是否已按规范兜底（全部参数来自配置，零硬编码）。
  # 注：process_cleanup_safe 组扫描 PowerShell 启动脚本（scripts/*.ps1）。后端 step 引擎 file_glob 用
  # fnmatch（不支持 *.{ts,ps1} brace 扩展），故启用该组时须以独立 step 覆盖 scan_dirs:
  # ["karpathy-wiki/scripts"]、file_glob: "*.ps1"，避免污染其余 4 组（它们只扫 *.ts）。
  groups:
    - name: "route_return_completeness"
      description: "reply.code(/reply.status( 响应构造须逐分支显式 return/throw，漏 return 致双发响应"
      severity: "warn"
      rule_ref: "BR-089"
      patterns:
        - "reply.code("
        - "reply.status("
    - name: "response_hook_safe"
      description: "全局响应钩子（onSend/onResponse/setSerializer/contentTypeParser）须 try/catch fail-open 且无 await 重计算"
      severity: "warn"
      rule_ref: "BR-090"
      patterns:
        - "addHook('onSend'"
        - "addHook(\"onSend\""
        - "addHook('onResponse'"
        - "addHook(\"onResponse\""
        - "setSerializer"
        - "contentTypeParser"
    - name: "compression_default_off"
      description: "压缩中间件须默认关闭且条件注册，阈值/级别来自配置而非硬编码"
      severity: "warn"
      rule_ref: "BR-091"
      patterns:
        - "register(compress"
        - "@fastify/compress"
        - "fastify-compress"
    - name: "user_store_init"
      description: "关键数据加载（loadUsers/loadConfig/JSON.parse）须区分 not-found 与 corrupt 并兜底回退默认"
      severity: "warn"
      rule_ref: "BR-092"
      patterns:
        - "loadUsers"
        - "loadConfig"
        - "JSON.parse("
    - name: "process_cleanup_safe"
      description: "PowerShell 启动/重启脚本清理占用端口旧进程须 Stop-Process -Force + try/catch（非致命），禁止裸 taskkill 作清理主键（其 stderr 在 $ErrorActionPreference='Stop' 下触发 NativeCommandError 中止脚本）"
      severity: "warn"
      rule_ref: "BR-093"
      patterns:
        - "taskkill"

frontend_review_static_check:
  # 启用：前端编码标准静态守卫（第十三轮复盘 / FR-077~FR-080）
  enabled: true
  # 扫描前端源码目录
  scan_dirs:
    - "karpathy-wiki/frontend/src"
  file_glob: "*.{ts,vue}"
  # 内置四组：编辑重发配对 / autoscroll 双 rAF / 成对按钮样式 / 编辑框撑满
  # required_patterns 缺失即告警（守护保护性代码被重构误删）；forbidden_patterns 命中即违规。
  groups:
    - name: "edit_resend_pair"
      description: "编辑重发必须同时具备 removeMessagesFrom + submitQuestion，缺一则悬空答案"
      severity: "error"
      rule_ref: "FR-077"
      forbidden_patterns: []
      required_patterns:
        - "removeMessagesFrom"
        - "submitQuestion"
    - name: "autoscroll_double_rAF"
      description: "流式自动滚动须保留 double requestAnimationFrame + stickToBottom"
      severity: "warn"
      rule_ref: "FR-078"
      forbidden_patterns:
        - "nextTick(scrollToBottom)"
      required_patterns:
        - "requestAnimationFrame"
        - "stickToBottom"
    - name: "button_style_pair"
      description: "编辑态确认/取消按钮样式须成对定义（.edit-btn.confirm / .edit-btn.cancel）"
      severity: "warn"
      rule_ref: "FR-079"
      forbidden_patterns: []
      required_patterns:
        - "edit-btn.confirm"
        - "edit-btn.cancel"
    - name: "editbox_width_fill"
      description: "编辑态输入框 wrapper（.msg-content-wrapper / .msg-edit）须撑满列宽"
      severity: "warn"
      rule_ref: "FR-080"
      forbidden_patterns:
        - "align-items: flex-end"
      required_patterns:
        - "msg-content-wrapper"
        - "msg-edit"
    - name: "auth_fetch_wrapped"
      # 受保护端点必须走带鉴权封装：禁止裸 fetch 调 requireAuth 端点（命中即 401 静默失效）
      description: "请求后端 requireAuth 受保护端点（/api/config、/api/ai/config 等）必须统一经带鉴权封装 apiFetch 调用，禁止裸 fetch 不带 Authorization 头（命中即 401 静默失效）；required_patterns 守护 apiFetch 封装不被误删"
      severity: "error"
      rule_ref: "FR-084 / BR-094 / CODING-AUTH-REQUEST-FETCH"
      forbidden_patterns:
        - "fetch('/api/config')"
        - "fetch(\"/api/config\")"
        - "fetch('/api/ai/config')"
        - "fetch(\"/api/ai/config\")"
      required_patterns:
        - "apiFetch"
    - name: "persistent_component_visible_watch"
      description: "常驻组件（v-show 后台播放等）须保留 watch(visible) 生命周期钩子，禁止在重构中误删导致切 Tab 播放态/账户态丢失（守护 FR-086 保护性代码不被删）"
      severity: "warn"
      rule_ref: "FR-086 / CODING-PERSISTENT-COMPONENT"
      forbidden_patterns: []
      required_patterns:
        - "watch(visible)"
    - name: "object_url_revoked"
      description: "TTS / 媒体 ObjectURL 使用须成对保留 URL.revokeObjectURL 释放逻辑，禁止误删导致 ObjectURL 常驻泄漏（守护 FR-087 保护性代码不被删）"
      severity: "error"
      rule_ref: "FR-087 / CODING-MEDIA-OBJECT-URL"
      forbidden_patterns: []
      required_patterns:
        - "revokeObjectURL"
    - name: "audio_autoplay_distinguished"
      description: "音频播放区分「语音合成失败」与「播放被浏览器拦截」两类文案且保留进度重置逻辑，禁止混报为同一含糊提示（守护 FR-088 保护性代码不被删）"
      severity: "error"
      rule_ref: "FR-088 / CODING-AUDIO-PLAYBACK-RELIABILITY"
      forbidden_patterns: []
      required_patterns:
        - "语音合成失败"
        - "播放被浏览器拦截"
    - name: "backdrop_filter_fixed_ancestor"
      description: "毛玻璃 backdrop-filter 包含块陷阱：滚动容器（如 .mobile-content）若带 backdrop-filter，其内嵌 position:fixed 悬浮元素（滚动到顶/到底 FAB、全屏 sheet 遮罩）会被困为绝对定位而随滚动滑走；守护 <Teleport to='.mobile-root'> 逃逸写法不被误删（对应 FR-089 / CODING-BACKDROP-FILTER-CB，多主题下 --m-blur 浅色=none / 毛玻璃=blur 触发主题间不一致）"
      severity: "error"
      rule_ref: "FR-089 / CODING-BACKDROP-FILTER-CB"
      forbidden_patterns: []
      required_patterns:
        - "Teleport"

dependency_store_hygiene_check:
  # 启用：依赖 store 卫生验证（CODING-PNPM-STORE-HYGIENE / 前端 FR-085 / 后端 BR-095）
  enabled: true
  # 全局 .npmrc 收敛键
  store_dir_key: "store-dir"
  # 统一 store 绝对路径（须按实际环境调整）
  canonical_store_dir: 'D:\.pnpm-store'
  # 禁止散落的 store 目录名
  forbidden_store_dirs:
    - ".pnpm-store"
  # 扫描根（相对项目根）
  scan_root: "karpathy-wiki"
  # 断言全局 ~/.npmrc 收敛键存在
  assert_npmrc_store_dir: true
  severity: "warn"
  rule_ref: "FR-085 / BR-095 / CODING-PNPM-STORE-HYGIENE"

idb_reactive_clone_check:
  # 启用：IndexedDB 写入前剥离 Vue/Pinia 响应式代理静态守卫（第十四轮复盘 / FR-081）
  enabled: true
  # 扫描前端源码目录（本项目对齐 karpathy-wiki/frontend/src）
  scan_dirs:
    - "karpathy-wiki/frontend/src"
  file_glob: "*.{ts,vue}"
  # IndexedDB 写入点模式（命中即须核对入参是否已深拷贝）
  scan_patterns:
    - "dbPut"
    - "saveUserConfig"
    - "idbPut"
    - "store.put"
    - "transactions.add"
  # 响应式来源指示符（窗口内出现即视为写入值可能为 Vue/Pinia 代理对象）
  reactive_indicators:
    - "reactive("
    - "toRefs("
    - "toRef("
    - "defineStore("
  # 写入点本行的响应式来源正则（store/state/this 访问、.value 取 ref、reactiveStore）
  reactive_arg_regex: "(store\\.|state\\.|this\\.|\\.value\\b|reactiveStore)"
  # 安全深拷贝指示符（JSON.parse(JSON.stringify) / clone( 等；userConfig.ts 的 saveUserConfig 已修复为 clone）
  safe_clone_indicators:
    - "JSON.parse(JSON.stringify"
    - "clone("
    - "deepClone("
    - "cloneDeep("
  # 伪剥离模式（toRaw( 仅剥顶层，命中即违规）
  forbidden_unsafe_patterns:
    - "toRaw("
  scan_window_lines: 40
  severity_missing_clone: "error"
  severity_unsafe: "error"
  rule_ref: "FR-081 / CODING-IDB-REACTIVE-CLONE"

# --- 部署产物磁盘验证（spa_live_deploy_check）第十九轮复盘 / BR-096 ---
# 验证改为「读磁盘最新目录」而非两次 HTTP 请求比对（spaRoot 启动只解析一次，
# 目录高频轮转下两次 HTTP 校验会读到不同根而误判）。启用磁盘验证 + 重启后端口轮询。
spa_live_deploy_check:
  enabled: true
  live_base_dir: "karpathy-wiki/api"
  live_dir_pattern: "public_live_"
  legacy_dir: "public"
  complete_marker: ".deploy-complete"
  asset_prefix: "/wiki/"
  malicious_paths:
    - "/wiki/../../etc/passwd"
    - "/wiki/..%2f..%2fapi/data/config.json"
    - "/wiki//absolute"
  restart_required: true
  verify_via_disk: true
  required_ports:
    - 3000

# --- 冒烟验证策略（smoke_strategy）第十七轮复盘（沙箱受限环境泛化）---
# 沙箱跨进程 localhost TCP 被拦截 + app.inject 全量 app 挂起 → 验证优先落在同一进程；
# 跨进程 TCP 仅在可达 localhost 的真实构建机启用。本仓库采用进程内冒烟（import buildApp
# + app.ready + 最小 SPA-static app inject），跨进程 TCP 默认关闭。
smoke_strategy:
  process_internal_inject:
    enabled: true
    env_guard: "WIKI_SMOKE"
    entry_export: "buildApp"
    ready_check: "app.ready()"
    minimal_static_app_paths:
      - "/"
      - "/wiki/"
      - "/wiki/assets/*"
  tcp_opt_in:
    enabled: false
    require_reachable_localhost: true
    endpoints:
      - { method: "GET",  path: "/health",     expect_status: 200 }
      - { method: "POST", path: "/api/cleanup", expect_status: 401 }
      - { method: "PUT",  path: "/api/schema",  expect_status: 401 }
  contract_assertions_on_real_host: true
  inject_smoke_script: "api/_smoke_inject.mjs"

# --- 实时部署流（deploy）第二十一轮复盘 / CODING-SPA-LIVE-DEPLOY ---
# 真实构建机端到端验证最后一步：构建 → 写全新时间戳目录 → 杀孤儿旧进程 → 重启后端 → 冒烟。
# 开发态复用已运行服务时 enabled:false（与 build.enabled/startup.enabled 一致）；发布时置 true 跑完整部署流。
deploy:
  enabled: true
  require_dangerously_disable_sandbox: true
  build_command: "node_modules/vite/bin/vite.js build --outDir ../builds/dist_u{timestamp}"
  build_run_dir: "karpathy-wiki/frontend"
  deploy_script: "api/_deploy_live.mjs"
  deploy_script_args: ["../builds/dist_u{timestamp}"]
  deploy_run_dir: "karpathy-wiki/api"
  orphan_port: 3000
  kill_strategy: "node_process_kill"
  restart_command: "node node_modules/tsx/dist/cli.mjs src/index.ts"
  restart_run_dir: "karpathy-wiki/api"
  restart_sandbox: true
  verify_via_disk: true
  verify_complete_marker: ".deploy-complete"
  deploy_marker: "MobileListen"
  smoke_endpoints:
    - { method: "GET", path: "/health", expect_status: 200 }
    - { method: "GET", path: "/", expect_status: 200 }
