# ============================================================
# wiki-auto-testing 配置文件
# 所有测试参数集中管理，技能本身不含任何硬编码值
# 修改此文件即可适配不同项目，无需改动 SKILL.md 或脚本模板
# ============================================================

# --- 工作目录配置 ---
# 脚本通过此配置定位项目根目录，避免 CWD 不一致导致 FileNotFoundError
working_directory:
  # 项目根目录的标记文件（向上查找此文件来确定项目根）
  # 留空则使用 config.yaml 所在位置向上查找 .git / package.json
  project_root_marker: ".git"
  # 是否在脚本启动时自动切换到项目根目录
  auto_chdir: true

# --- 构建配置 ---
build:
  # 是否需要构建（dev server 模式可设为 false 跳过构建）
  enabled: false
  # 构建脚本路径（相对于项目根目录）
  script_path: "karpathy-wiki/scripts/前端构建.bat"
  # 构建产物路径（相对于项目根目录，用于验证构建成功）
  artifact_path: "karpathy-wiki/packages/web/dist/index.html"
  # 构建超时秒数
  timeout_sec: 120

# --- 启动配置 ---
startup:
  # 是否需要启动服务（服务已运行时可设为 false 跳过）
  enabled: false
  # 启动脚本路径（相对于项目根目录）
  script_path: "karpathy-wiki/scripts/启动服务.bat"
  # 停止脚本路径（可选，测试结束后清理用）
  stop_script_path: "karpathy-wiki/scripts/停止服务.bat"
  # 是否在测试结束后停止服务
  stop_after_test: false

# --- 服务配置 ---
service:
  # 前端访问地址（Vite dev server 或构建产物服务地址）
  frontend_url: "http://localhost:5173"
  # 后端 API 基地址
  api_url: "http://localhost:3000"
  # 健康检查端点（相对于 api_url）
  health_endpoint: "/health"
  # 服务启动最大等待秒数
  startup_timeout_sec: 60
  # 端口轮询间隔秒数
  port_check_interval_sec: 2
  # 需要监听的端口列表（用于服务就绪判断）
  required_ports:
    - 3000
    - 5173

# --- 浏览器配置 ---
browser:
  # 是否使用无头模式（CI 环境推荐 true，调试时可选 false）
  headless: true
  # Chromium 启动参数（解决 headless 下 Canvas/WebGL 崩溃等问题）
  launch_args:
    - "--disable-gpu"
    - "--no-sandbox"
    - "--disable-dev-shm-usage"
    - "--disable-setuid-sandbox"
  # 多视口测试（响应式布局验证）
  viewports:
    desktop:
      width: 1440
      height: 900
    mobile:
      width: 375
      height: 812

# --- 页面导航配置 ---
# 描述 SPA 中各页面的导航方式和预期元素
navigation:
  # 导航按钮的 CSS 选择器（所有 tab 按钮的公共 class）
  tab_selector: ".tab-btn"
  # 点击后等待页面渲染的毫秒数
  page_render_wait_ms: 1500
  # 页面定义列表（顺序即测试顺序）
  pages:
    - key: "dashboard"
      label: "仪表盘"
      # 该页面应存在的关键元素（用于验证页面正确渲染）
      expected_elements:
        - { selector: ".robot-avatar, [class*='avatar']", name: "机器人头像" }
        - { selector: ".title, .grad-text", name: "导航标题" }
        - { selector: ".glass-card, .card, [class*='card']", name: "信息卡片" }
    - key: "ingest"
      label: "投递资料"
      expected_elements:
        - { selector: ".el-tabs__item", name: "Element Plus 标签页" }
    - key: "browse"
      label: "知识浏览"
      expected_elements:
        - { selector: "[class*='browse'], [class*='tree']", name: "浏览树" }
    - key: "query"
      label: "知识问答"
      expected_elements:
        - { selector: "input[type='text'], textarea", name: "问答输入框" }
    - key: "graph"
      label: "图谱"
      expected_elements:
        - { selector: "canvas, svg, [class*='graph']", name: "图谱画布" }
    - key: "health"
      label: "体检"
      expected_elements:
        - { selector: "[class*='health'], [class*='status']", name: "体检状态" }
    - key: "config"
      label: "配置"
      expected_elements:
        - { selector: ".el-tabs__item, [role='tab']", name: "配置标签页" }
    - key: "tunnel"
      label: "内网穿透"
      expected_elements:
        - { selector: ".glass-card", name: "隧道状态卡片" }
        - { selector: ".el-tag", name: "状态标签" }
        - { selector: ".el-button", name: "操作按钮" }
        - { selector: ".el-select", name: "Provider 选择器" }

# --- 按钮自动发现配置 ---
# 自动遍历所有页面，发现并测试所有可交互按钮
button_discovery:
  # 是否启用按钮自动发现（补充预定义交互测试的覆盖盲区）
  enabled: true
  # 按钮元素的 CSS 选择器列表（按优先级排序，匹配到的都会被测试）
  button_selectors:
    - "button:not([disabled])"
    - ".el-button:not(.is-disabled)"
    - "[role='button']:not([disabled])"
    - ".shortcut-item"
    - ".suggestion-chip"
    - ".el-tabs__item"
    - ".el-tree-node__content"
    - ".clickable, [cursor='pointer']"
  # 排除选择器（匹配这些选择器的元素不会被点击）
  exclude_selectors:
    - ".is-disabled"
    - "[aria-disabled='true']"
  # 破坏性按钮文本列表（匹配则仅验证存在，不执行点击）
  # 这些按钮会修改数据/文件系统，点击可能造成不可逆变更
  destructive_button_texts:
    - "删除"
    - "清除"
    - "重置"
    - "修复"
    - "初始化"
    - "启动隧道"
    - "停止隧道"
    - "保存配置"
  # 每个按钮点击后的等待毫秒数
  click_wait_ms: 800
  # 点击失败后是否继续测试下一个按钮
  continue_on_failure: true
  # 是否使用 force=True 跳过元素稳定性检查（解决 transition 动画问题）
  force_click: true

# --- 交互测试配置 ---
# 定义各页面的具体交互行为（与 button_discovery 互补）
interactions:
  # 主题切换器配置
  theme_switcher:
    trigger_selector: ".theme-switcher .trigger"
    panel_selector: ".theme-switcher .panel"
    item_selector: ".theme-switcher .theme-item"
    # 切换后面板关闭的过渡动画等待毫秒数
    transition_wait_ms: 1000
    # 是否使用 JS dispatchEvent 绕过 transition 时序问题
    use_js_click: true

  # 投递资料页面交互
  ingest:
    # Element Plus 标签页选择器
    tab_item_selector: ".el-tabs__item"
    # 需要点击的标签页文本
    target_tab_label: "文本粘贴"
    # 文本输入框选择器（切换标签页后可见的）
    textarea_selector: "textarea:visible"
    # 测试输入内容
    test_text: "This is a test document for knowledge base ingestion."
    # 提交按钮文本
    submit_button_text: "开始编译"

  # 配置页面交互
  config:
    # 进入编辑模式的按钮文本
    edit_button_text: "编辑"
    # 保存按钮文本（编辑模式下可见）
    save_button_text: "保存"

  # 知识问答页面交互
  query:
    input_selector: "input[type='text'], textarea"
    test_question: "What is machine learning?"
    # 提交方式：button 或 enter
    submit_method: "enter"

# --- API 端点测试配置 ---
api_tests:
  # 使用 Playwright request API（避免浏览器 CORS 限制）
  use_playwright_request: true
  endpoints:
    - path: "/health"
      expected_status: 200
    - path: "/api/stats"
      expected_status: 200
    - path: "/api/config"
      expected_status: 200
    - path: "/api/files/tree"
      expected_status: 200
    - path: "/api/graph"
      expected_status: 200
    - path: "/api/tunnel/status"
      expected_status: 200
    - path: "/api/tunnel/config"
      expected_status: 200

# --- 控制台错误过滤 ---
# 匹配这些关键词的错误将被忽略（非应用本身的错误）
console_error_filter:
  - "favicon"
  - "extension"
  - "devtools"
  - "cors"
  - "err_failed"
  - "access-control"

# --- 超时配置（毫秒）---
timeout:
  # 页面加载超时
  page_load_ms: 30000
  # 元素等待超时
  element_wait_ms: 5000
  # networkidle 等待超时
  networkidle_ms: 30000

# --- 输出配置 ---
output:
  # 截图保存目录（相对于项目根目录）
  screenshot_dir: "test_screenshots"
  # 基线测试结果 JSON 文件路径
  result_file: "test_result.json"
  # 按钮测试结果 JSON 文件路径（自动发现测试专用）
  button_result_file: "test_buttons_result.json"
  # 文件编码
  encoding: "utf-8"
  # 是否在测试结束后自动打开截图目录
  open_screenshot_dir: false

# --- 编码安全配置 ---
encoding_safety:
  # Python 脚本写入时是否添加 BOM（推荐 false）
  add_bom: false
  # 源文件编码检查（构建前检测）
  check_source_encoding: true
  # 允许的源文件编码列表
  allowed_encodings:
    - "utf-8"
    - "utf-8-sig"
  # 是否自动修复 Python 脚本编码（GBK → UTF-8）
  auto_fix_python_encoding: true
  # Windows 下 Write 工具默认编码（用于检测和转换）
  windows_default_encoding: "gbk"

# --- bat 脚本处理 ---
bat_script:
  # 是否通过管道输入绕过 pause 命令
  bypass_pause: true
  # 绕过 pause 的管道输入内容
  pause_bypass_input: '""'

# --- 终端配置 ---
# PowerShell 环境的特殊处理
terminal:
  # 是否拆分长命令为短命令（避免 PSReadLine 缓冲区崩溃）
  split_long_commands: true
  # 单条命令最大长度（超过则拆分）
  max_command_length: 200
  # 是否使用新终端执行命令（避免 PSReadLine 状态污染）
  use_fresh_terminal: true
