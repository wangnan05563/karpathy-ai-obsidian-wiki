# ============================================================
# wiki-auto-testing 项目配置
# 所有项目特定参数在此配置，技能通用默认值在 defaults.yaml
# 本项目配置会自动合并 defaults.yaml 的默认值
# ============================================================

# --- 构建配置（项目特定） ---
build:
  script_path: "karpathy-wiki/scripts/前端构建.bat"
  artifact_path: "karpathy-wiki/api/public/index.html"

# --- 启动配置（项目特定） ---
startup:
  script_path: "karpathy-wiki/scripts/启动服务.bat"
  stop_script_path: "karpathy-wiki/scripts/停止服务.bat"

# --- 服务配置（项目特定） ---
service:
  frontend_url: "http://localhost:5173"
  api_url: "http://localhost:3000"
  health_endpoint: "/health"
  required_ports:
    - 3000
    - 5173

# --- 页面导航配置（项目特定） ---
navigation:
  pages:
    - key: "dashboard"
      label: "仪表盘"
      expected_elements:
        - { selector: ".robot-avatar, [class*='avatar']", name: "机器人头像" }
        - { selector: ".title, .grad-text", name: "导航标题" }
        - { selector: ".glass-card, .card, [class*='card']", name: "信息卡片" }
    - key: "ingest"
      label: "投递资料"
      expected_elements:
        - { selector: ".el-tabs__item", name: "Element Plus 标签页" }
    - key: "browse"
      label: "知识浏览"
      expected_elements:
        - { selector: "[class*='browse'], [class*='tree']", name: "浏览树" }
    - key: "query"
      label: "知识问答"
      expected_elements:
        - { selector: "input[type='text'], textarea", name: "问答输入框" }
        # F-3.4 输入工具栏 7 chip
        - { selector: ".input-toolbar, [class*='input-toolbar']", name: "输入工具栏" }
        # F-3.5 多模态图片上传按钮
        - { selector: ".upload-btn, .attachment-uploader, [class*='attachment']", name: "图片上传按钮" }
        # F-3.9 模型切换选择器
        - { selector: ".model-selector, [class*='model-selector']", name: "模型切换器" }
    - key: "graph"
      label: "图谱"
      expected_elements:
        - { selector: "canvas, svg, [class*='graph']", name: "图谱画布" }
    - key: "health"
      label: "体检"
      expected_elements:
        - { selector: "[class*='health'], [class*='status']", name: "体检状态" }
    - key: "config"
      label: "配置"
      expected_elements:
        - { selector: ".el-tabs__item, [role='tab']", name: "配置标签页" }
    - key: "tunnel"
      label: "内网穿透"
      expected_elements:
        - { selector: ".glass-card", name: "隧道状态卡片" }
        - { selector: ".el-tag", name: "状态标签" }
        - { selector: ".el-button", name: "操作按钮" }
        - { selector: ".el-select", name: "Provider 选择器" }

# --- 交互测试配置（项目特定） ---
interactions:
  theme_switcher:
    trigger_selector: ".theme-switcher .trigger"
    panel_selector: ".theme-switcher .panel"
    item_selector: ".theme-switcher .theme-item"
  ingest:
    tab_item_selector: ".el-tabs__item"
    target_tab_label: "文本粘贴"
    textarea_selector: "textarea:visible"
    test_text: "This is a test document for knowledge base ingestion."
    submit_button_text: "开始编译"
  config:
    edit_button_text: "编辑"
    save_button_text: "保存"
  query:
    input_selector: "input[type='text'], textarea"
    test_question: "What is machine learning?"
    submit_method: "enter"

# --- API 端点测试配置（项目特定） ---
api_tests:
  endpoints:
    - path: "/health"
      expected_status: 200
    - path: "/api/stats"
      expected_status: 200
    - path: "/api/config"
      expected_status: 200
    - path: "/api/files/tree"
      expected_status: 200
    - path: "/api/graph"
      expected_status: 200
    - path: "/api/tunnel/status"
      expected_status: 200
    - path: "/api/tunnel/config"
      expected_status: 200
    # F-3.9 模型切换：预设列表 + 当前配置
    - path: "/api/ai/presets"
      expected_status: 200
    - path: "/api/ai/config"
      expected_status: 200
    # F-3.10 联网搜索状态
    - path: "/api/cleanup/status"
      expected_status: 200

# ============================================================
# 以下为系统清理模块前端验证复盘补充配置
# 所有参数可配置，避免硬编码
# ============================================================

# --- 编码检测测试配置（项目特定） ---
# 用于检测页面 DOM 文本是否包含 U+FFFD 替换字符（编码乱码标志）
encoding_tests:
  enabled: true
  # 需要检测的页面 key（对应 navigation.pages 中的 key）
  check_pages: ["dashboard", "cleanup"]
  # U+FFFD 替换字符的码点标识（统一用字符串配置，避免 YAML 解析歧义）
  fffd_codepoint: "0xFFFD"
  # 检测方法：dom_text_codepoints（dump DOM 文本并检查码点）
  check_method: "dom_text_codepoints"
  # 失败时是否截图取证
  screenshot_on_fail: true
  # 扫描的 DOM 选择器范围（避免扫描整个 body 导致大量噪音）
  scan_selectors:
    - ".el-tabs__item"
    - ".title"
    - ".grad-text"
    - "h1, h2, h3"
    - "label"
    - ".el-form-item__label"

# --- 危险操作测试配置（项目特定） ---
# 验证 dry_run 默认开启 / danger 样式 / 二次确认 / 取消不发请求
dangerous_action_tests:
  enabled: true
  test_pages:
    - key: "cleanup"
      forms:
        - key: "compileCache"
          # 是否有 days 输入框（days 阈值参数）
          has_days_input: false
          # dry_run 默认应开启，避免误删
          default_dry_run: true
        - key: "runLogs"
          has_days_input: true
          default_dry_run: true
      # 二次确认弹窗组件选择器（Element Plus MessageBox）
      confirm_component: ".el-message-box"
      # 确认弹窗取消按钮文本（用 Unicode 码点匹配可绕过终端编码问题）
      confirm_cancel_text: "取消"
      confirm_ok_text: "确认清理"
      # danger 样式类名（点击触发后按钮应带此类）
      danger_class: "danger"
      # dry_run 开关选择器
      dry_run_switch: ".el-switch"
      # 表单容器选择器（用于定位每个独立表单）
      form_container_selector: ".cleanup-form"
      # loading 状态选择器（验证表单独立 loading）
      loading_selector: ".el-loading-mask"
      # result 显示选择器（验证表单独立 result）
      result_selector: ".cleanup-result"

# --- 服务生命周期配置（项目特定） ---
# 测试前停止旧进程 / 启动新服务 / 验证端口 / 测试后停止服务
service_lifecycle:
  # 是否在测试前停止占用端口的旧进程
  stop_old_process: true
  # 停止方法：Get-NetTCPConnection（通过端口反查进程）
  stop_method: "Get-NetTCPConnection"
  # 启动后端服务命令
  start_backend: "npm run dev:api"
  # 启动前端服务命令
  start_frontend: "npm run dev:web"
  # 启动模式：non-blocking（非阻塞，启动后立即返回，避免卡住测试流程）
  start_mode: "non-blocking"
  # 端口检查方法：Get-NetTCPConnection
  port_check_method: "Get-NetTCPConnection"
  # 端口检查状态：Listen（监听中即视为就绪）
  port_check_state: "Listen"
  # 启动超时（毫秒），超时则判定启动失败
  startup_timeout_ms: 30000
  # 端口轮询间隔（毫秒）
  port_poll_interval_ms: 1000

# --- 临时文件清理配置（项目特定） ---
# 测试过程中产生的临时 Python 脚本和截图的清理策略
cleanup:
  # 临时测试脚本文件名 pattern
  temp_files_pattern: "_test_*.py"
  # 临时截图文件名 pattern
  temp_screenshots_pattern: "_test_*.png"
  # 测试成功时是否清理临时文件
  cleanup_on_success: true
  # 测试失败时是否清理临时文件（默认保留以便排查）
  cleanup_on_failure: false
  # 清理目录范围（默认当前工作目录）
  cleanup_dirs:
    - "."
    - "test_screenshots"

# --- PowerShell 环境约束（项目特定） ---
# Windows PowerShell 5.1 的语法限制和约束
powershell_constraints:
  # 命令分隔符（PowerShell 不支持 &&，用 ; 分隔顺序执行）
  command_separator: ";"
  # 被禁用的命令（容易引发编码或安全问题）
  blocked_commands: ["cmd /c"]
  # PowerShell 只读变量（不可重新赋值）
  readonly_vars: ["$pid", "$PWD", "$HOME"]
  # 是否使用 RunCommand 的 cwd 参数而非 cd 前缀
  use_cwd_param: true
  # 启动 bat 脚本时是否绕过 pause（避免卡住自动化流程）
  bypass_bat_pause: true
  # 绕过 pause 的输入内容
  pause_bypass_input: '""'

# ============================================================
# 以下为历史问题复盘补充配置（第二批次）
# 覆盖路由注册、类型同步、CORS 绕过、Headless 崩溃、PowerShell 兼容、编码增强
# 所有参数可配置，避免硬编码
# ============================================================

# --- 路由注册验证配置 ---
# 自动检测后端路由文件是否在入口文件中注册
route_registration_check:
  # 是否启用路由注册验证
  enabled: true
  # 后端路由目录（相对于项目根目录）
  backend_route_directory: "karpathy-wiki/api/src/routes"
  # 后端入口文件（相对于项目根目录）
  backend_entry_file: "karpathy-wiki/api/src/index.ts"
  # 注册函数命名模式（用于 Grep 匹配）
  register_function_pattern: "register"
  # 豁免文件列表（不需注册的路由文件名）
  exempt_files: []
  # 前端视图目录（相对于项目根目录，留空则跳过前端检查）
  frontend_views_directory: "karpathy-wiki/frontend/src/views"
  # 前端入口文件（相对于项目根目录）
  frontend_entry_file: "karpathy-wiki/frontend/src/App.vue"
  # 前端视图类型名（如 ViewName）
  frontend_view_type_name: "ViewName"
  # 前端视图必须注册的钩子列表
  frontend_required_hooks:
    - "import"
    - "type"
    - "v-for"
    - "v-else-if"

# --- 类型同步验证配置 ---
# 自动检测前后端 types.ts 接口字段是否对齐
type_sync_check:
  # 是否启用类型同步验证
  enabled: true
  # 后端 types.ts 路径（相对于项目根目录）
  backend_types_path: "karpathy-wiki/api/src/types.ts"
  # 前端 types.ts 路径（相对于项目根目录）
  frontend_types_path: "karpathy-wiki/frontend/src/types.ts"
  # 需同步的接口名列表（留空则检测全部 export interface）
  sync_interfaces: []
  # 忽略的接口名列表（如仅后端使用的内部接口）
  ignore_interfaces:
    - "EngineAdapter"
    - "VaultService"

# --- CORS 绕过策略配置 ---
# API 测试使用 Playwright context.request 绕过浏览器 CORS 限制
cors_bypass:
  # 是否启用 CORS 绕过（API 测试默认使用 context.request）
  enabled: true
  # 绕过策略：context_request | backend_proxy | disabled
  strategy: "context_request"
  # 需绕过的 API 路径前缀列表
  api_path_prefixes:
    - "/api"
    - "/health"

# --- Headless 崩溃防护配置 ---
# Chromium headless 模式崩溃防护
headless_crash_guard:
  # 是否启用崩溃防护
  enabled: true
  # 必须的启动参数列表（headless 模式下）
  required_launch_args:
    - "--disable-gpu"
    - "--no-sandbox"
    - "--disable-dev-shm-usage"
    - "--disable-setuid-sandbox"
  # 崩溃重试次数
  max_retries: 2
  # 崩溃重试间隔（毫秒）
  retry_interval_ms: 2000

# --- PowerShell 兼容性配置 ---
# Windows PowerShell 环境的命令兼容性处理
powershell_compatibility:
  # 是否启用 PowerShell 兼容性检查
  enabled: true
  # 禁止使用的语法列表（PowerShell 不支持）
  forbidden_syntaxes:
    - "&&"
    - "||"
  # 替代语法映射
  syntax_replacements:
    "&&": ";"
    "||": "; "
  # 是否拆分长命令
  split_long_commands: true
  # 单条命令最大长度
  max_command_length: 200
  # 是否使用新终端执行命令
  use_fresh_terminal: true

# --- 编码安全增强配置 ---
# 在现有 encoding_safety 段基础上增强
encoding_safety_enhanced:
  # 写入文件后是否验证编码
  verify_after_write: true
  # 检测 U+FFFD 替换字符（编码损坏标志）
  check_replacement_char: true
  # U+FFFD 允许出现的最大次数（0 = 不允许）
  replacement_char_threshold: 0
  # 检测的文件扩展名列表
  check_extensions:
    - ".ts"
    - ".vue"
    - ".py"
    - ".md"
    - ".json"
    - ".yaml"

# ============================================================
# 以下为帮助文档与关于模块测试复盘补充配置（第三批次）
# 覆盖滚动容器、SPA 内部跳转、检查更新状态机
# 所有参数可配置，避免硬编码
# ============================================================

# --- 滚动容器测试配置（项目特定） ---
# 验证 flex 布局的多卡片长内容页面是否存在双重滚动裁切问题
# 帮助文档页面曾因 .help-content-area 设 overflow-y: auto 与外层 .content 形成双重滚动
# 导致章节卡片被压缩到 ~50px，仅显示标题，内容被裁切
scroll_container_tests:
  enabled: true
  # 需要检测的页面 key（对应 navigation.pages 中的 key）
  test_pages: ["help", "about"]
  # 外层滚动容器选择器（已设 overflow-y: auto 接管页面滚动）
  outer_scroll_selectors:
    - ".content"
  # 内层可能重复设 overflow-y: auto 的容器选择器
  inner_overflow_selectors:
    - ".help-content-area"
    - ".about-content-area"
  # 卡片类选择器（可能产生 overflow: hidden 副作用）
  card_selectors:
    - ".glass-card"
    - ".intro-card"
    - ".section-card"
  # 卡片最小高度阈值（px），低于此值视为被压缩
  min_card_height_px: 200
  # 是否验证卡片内容可见性（标题 + 至少一个内容块）
  require_content_visible: true
  # 失败时是否截图取证
  screenshot_on_fail: true

# --- SPA 内部跳转测试配置（项目特定） ---
# 验证跨组件视图切换（如 About → Help）的 CustomEvent 派发与监听
# 项目使用 SPA 手动路由（currentView ref + v-if/v-else-if），无 vue-router
# About.vue 的"查看帮助文档"按钮通过 dispatchEvent 跳转到 Help.vue
spa_navigation_tests:
  enabled: true
  # 测试跳转链路列表
  test_routes:
    - from: "about"
      to: "help"
      trigger_selector: ".help-link, [class*='help-link']"
      trigger_text: "查看帮助文档"
    - from: "help"
      to: "about"
      trigger_selector: ".about-link, [class*='about-link']"
      trigger_text: "返回关于"
  # 事件名模式（与 wiki-frontend-code-review 的 spa_navigation.event_name_pattern 对齐）
  event_name_pattern: "{project}:navigate"
  # 项目名（替换事件名中的 {project} 占位符）
  project_name: "karpathy"
  # 入口组件路径（监听事件的组件）
  app_entry: "karpathy-wiki/frontend/src/App.vue"
  # 是否验证监听器在 onBeforeUnmount 中清理
  require_lifecycle_pair: true
  # 是否验证 detail 字段在白名单内
  validate_detail_whitelist: true
  # 允许跳转的视图名白名单
  allowed_views:
    - "dashboard"
    - "ingest"
    - "browse"
    - "query"
    - "graph"
    - "health"
    - "config"
    - "tunnel"
    - "about"
    - "help"
  # 跳转后等待视图切换的最大时间（毫秒）
  switch_wait_ms: 1000

# --- 检查更新状态机测试配置（项目特定） ---
# 验证检查更新功能的状态机完整性、定时器清理、轮询节奏
# About.vue 的检查更新按钮需覆盖 5 态：idle/loading/latest/newer/error
# 项目无 GitHub Release 通道，离线模式固定返回 has_update: false
update_check_tests:
  enabled: true
  # 需要检测的页面 key
  test_pages: ["about"]
  # 检查更新接口路径
  update_endpoint: "/api/about/check-update"
  # 必需状态列表
  required_states:
    - "idle"
    - "loading"
    - "latest"
    - "newer"
    - "error"
  # 后端缓存 TTL（毫秒）
  cache_ttl_ms: 300000
  # 轮询间隔（毫秒），必须 >= cache_ttl_ms
  poll_interval_ms: 300000
  # 首次检查延迟（毫秒）
  first_check_delay_ms: 5000
  # latest 状态自动回 idle 的延迟（毫秒）
  latest_to_idle_ms: 3000
  # 离线模式（true 时后端固定返回 has_update: false）
  offline_mode: true
  # 是否验证定时器在 onBeforeUnmount 中清理
  require_timer_cleanup: true
  # 是否验证轮询间隔 >= 缓存 TTL
  validate_poll_ge_ttl: true
  # 模拟离线模式时是否验证后端不发起外部请求
  validate_no_external_call_in_offline: true
  # 失败时是否截图取证
  screenshot_on_fail: true
