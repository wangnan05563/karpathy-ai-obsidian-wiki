# ============================================================
# wiki-* 技能 Token 预算配置
# scan_tokens.py 读取本文件，对比实际字符数与预算，标记超预算文件
# 字符数为单位；token ≈ 字符数 / 3.5
# 调整预算时需同步评估对技能加载完整性的影响
# ============================================================

# --- 各类文件的字符数上限 ---
# SKILL.md 是入口文件，每次加载必读，预算最严格
# config 文件含参数表，允许较大但需控制描述冗余
# references 单文件按需加载，适中
# defaults.yaml 只保留通用默认，应精简
budgets:
  skill_md: 20000
  config_file: 35000
  references_single: 15000
  defaults_yaml: 15000
  skill_loader: 20000
  template_py: 40000

# --- 各技能总 token 预算 ---
# 四技能合计目标 ≤ 300K（优化前 ~500K，节省 ~40%）
# 单技能预算基于其规则数量与职责范围
skill_total_budgets:
  wiki-code-dev: 90000
  wiki-frontend-code-review: 80000
  wiki-backend-code-review: 90000
  wiki-auto-testing: 80000

# --- 冗余阈值 ---
# 超过阈值时扫描脚本告警，提示需优化
redundancy_thresholds:
  # defaults.yaml 与 config.yaml 顶层 key 重合率超此值告警
  # 高重合意味着 config.yaml 重复了 defaults 的内容，应精简为只保留覆盖项
  defaults_config_overlap_pct: 30
  # SKILL.md 中超过此行数的章节建议拆分到 references（渐进式披露）
  skill_md_movable_section_lines: 50
